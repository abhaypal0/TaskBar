<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="TaskBar.css">
</head>
<body>
    <div class="container">
        <h2>MY TASKS</h2>
        
        <div class="input-row">
            <input type="text" id="taskInput" placeholder="What needs to be done?" autofocus>
            <button id="addBtn" class="add-btn">ADD</button>
        </div>

        <ul id="taskList">
            </ul>

        <div class="filters">
            <span>Priority: Normal</span>
        </div>
    </div>
    <script src="TaskBar.js"></script>
</body>
</html>
